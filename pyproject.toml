[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-tag"
version = "0.1.0"
description = "Bus Pirate / MFRC522 MIFARE Classic CLI"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5,<4"]

[project.scripts]
omni-tag = "omni_tag.cli:main"

[tool.setuptools.packages.find]
include = ["omni_tag*"]
